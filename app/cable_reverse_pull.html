<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#333333">
    <title>Cable Reverse Pull · WWM</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="exercise.css">
</head>
<body data-exercise="cable_reverse_pull">
    <a class="home-button" href="back.html" aria-label="返回">⬅️</a>
    <header>
        <h1>Cable Reverse Pull</h1>
        <p id="exerciseDescription">拉至耳朵後側，身體微微後傾，方向為斜上斜下。後拉時使用爆發力，回放時緩慢。</p>
    </header>
    <main class="stage">
        <figure>
            <video id="standardVideo" src="cable_reverse_pull.mp4" playsinline muted preload="auto"></video>
            <figcaption>示範</figcaption>
        </figure>
        <figure class="camera">
            <div class="frame">
                <video id="userCamera" playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <figcaption>你</figcaption>
        </figure>
    </main>
    <button id="startBtn" type="button">開始</button>
    <p id="status" role="status"></p>
    <div id="similarityDisplay" aria-live="polite"></div>
    <script type="module" src="js/exercise.js"></script>
</body>
</html>
