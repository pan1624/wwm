<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#333333">
    <title>Single Leg Squat · WWM</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="exercise.css">
</head>
<body data-exercise="single_leg_squat">
    <a class="home-button" href="thigh.html" aria-label="返回">⬅️</a>
    <header>
        <h1>Single Leg Squat</h1>
        <p id="exerciseDescription">保持挺胸收緊核心、不拱背，膝蓋腳尖朝正前方，膝蓋盡量不超過腳尖。</p>
    </header>
    <main class="stage">
        <figure>
            <video id="standardVideo" src="single_leg_squat.mp4" playsinline muted preload="auto"></video>
            <figcaption>示範</figcaption>
        </figure>
        <figure class="camera">
            <div class="frame">
                <video id="userCamera" playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <figcaption>你</figcaption>
        </figure>
    </main>
    <button id="startBtn" type="button">開始</button>
    <p id="status" role="status"></p>
    <div id="similarityDisplay" aria-live="polite"></div>
    <script type="module" src="js/exercise.js"></script>
</body>
</html>
